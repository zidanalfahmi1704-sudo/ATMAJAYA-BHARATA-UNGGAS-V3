    <script>
        const DEFAULT_USERS = [
            { id: 1, name: "Pak Atmajaya", username: "admin", password: "admin123", role: "admin", label: "Pemilik / Admin Utama" },
            { id: 2, name: "Kasir", username: "kasir", password: "kasir123", role: "admin", label: "Kasir Pembayaran" },
            { id: 3, name: "Staff Biaya", username: "staff", password: "staff123", role: "staff", label: "Staff Operasional" }
        ];

        const DEFAULT_MASTERS = {
            pemasok: [
                { id: "SUP-01", nama: "PT Charoen Pokphand Jaya", telepon: "081234567890", alamat: "Kandang Subang" },
                { id: "SUP-02", nama: "PT Japfa Comfeed", telepon: "081987654321", alamat: "Farm Kediri" }
            ],
            konsumen: [
                { id: "CUST-01", nama: "Toko Ayam Broiler Jaya", telepon: "08122334455", alamat: "Pasar Pahing" },
                { id: "CUST-02", nama: "Kemitraan Resto", telepon: "08567890123", alamat: "Malang" }
            ],
            sopir: [
                { id: "DRV-01", nama: "Budi Santoso", telepon: "081233334444" },
                { id: "DRV-02", nama: "Joko Susilo", telepon: "085788889999" }
            ],
            nopol: [
                { id: "NPL-01", nopol: "AG 8912 UT", jenis: "Truk Colt Diesel Box", sopirDefault: "Budi Santoso" },
                { id: "NPL-02", nopol: "AG 9043 AB", jenis: "Truk Engkel Keranjang", sopirDefault: "Joko Susilo" }
            ]
        };

        let currentUser = null;
        let usersData = JSON.parse(localStorage.getItem('atma_users_v2_1')) || DEFAULT_USERS;
        let masterData = JSON.parse(localStorage.getItem('atma_masters_v2_1')) || DEFAULT_MASTERS;
        let purchasesData = JSON.parse(localStorage.getItem('atma_purchases_v2_1')) || [];
        let salesData = JSON.parse(localStorage.getItem('atma_sales_v2_1')) || [];
        let expensesData = JSON.parse(localStorage.getItem('atma_expenses_v2_1')) || [];
        let purchasePayments = JSON.parse(localStorage.getItem('atma_purchase_payments_v2_1')) || [];
        let salesPayments = JSON.parse(localStorage.getItem('atma_sales_payments_v2_1')) || [];

        let activeTab = 'dashboard';
        let currentFilterMonth = new Date().getMonth() + 1;
        let currentFilterYear = new Date().getFullYear();
        let currentFilterDate = '';
        let tempTransactionItems = [];
        let currentFotoBiayaBase64 = ''; 

        function initSampleDataV2() {
            if (purchasesData.length === 0) {
                const prevDate = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                purchasesData = [{
                    id: "BELI-20260901", tanggal: prevDate, pemasok: "PT Charoen Pokphand Jaya", totalBeli: 85975000, totalOperasional: 950000, totalTonase: 3950,
                    items: [
                        { nopol: "AG 8912 UT", sopir: "Budi Santoso", harga: 21500, tonase: 1850, subtotal: 39775000, operasional: 450000 },
                        { nopol: "AG 9043 AB", sopir: "Joko Susilo", harga: 22000, tonase: 2100, subtotal: 46200000, operasional: 500000 }
                    ]
                }];
                localStorage.setItem('atma_purchases_v2_1', JSON.stringify(purchasesData));
            }

            if (salesData.length === 0) {
                const prevDate = new Date(Date.now() - 86400000).toISOString().split('T')[0];
                salesData = [{
                    id: "INV-20260901", tanggal: prevDate, konsumen: "Toko Ayam Broiler Jaya", totalJual: 77400000, totalTonase: 3000,
                    items: [
                        { nopol: "AG 8912 UT", sopir: "Budi Santoso", harga: 25500, tonase: 1200, subtotal: 30600000 },
                        { nopol: "AG 9043 AB", sopir: "Joko Susilo", harga: 26000, tonase: 1800, subtotal: 46800000 }
                    ]
                }];
                localStorage.setItem('atma_sales_v2_1', JSON.stringify(salesData));
            }
        }

        initSampleDataV2();

        function saveData() {
            localStorage.setItem('atma_users_v2_1', JSON.stringify(usersData));
            localStorage.setItem('atma_masters_v2_1', JSON.stringify(masterData));
            localStorage.setItem('atma_purchases_v2_1', JSON.stringify(purchasesData));
            localStorage.setItem('atma_sales_v2_1', JSON.stringify(salesData));
            localStorage.setItem('atma_expenses_v2_1', JSON.stringify(expensesData));
            localStorage.setItem('atma_purchase_payments_v2_1', JSON.stringify(purchasePayments));
            localStorage.setItem('atma_sales_payments_v2_1', JSON.stringify(salesPayments));
        }

        const formatRp = (num) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
        const formatKg = (num) => new Intl.NumberFormat('id-ID').format(num || 0) + ' kg';
        const formatTanggal = (dateStr) => {
            if(!dateStr) return '';
            const d = new Date(dateStr);
            return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
        };
        const generateId = (prefix) => `${prefix}-${Date.now().toString().slice(-6)}`;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' : type === 'danger' ? 'bg-red-600' : 'bg-slate-800';
            const icon = type === 'success' ? 'fa-circle-check' : type === 'danger' ? 'fa-triangle-exclamation' : 'fa-circle-info';

            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 transition duration-300 pointer-events-auto text-xs font-semibold transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i class="fa-solid ${icon} text-lg"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 50);
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-y-2'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function showModal(htmlContent) {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.innerHTML = htmlContent;
            overlay.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeModal() {
            const overlay = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); content.innerHTML = ''; }, 200);
        }

        function confirmAction(title, message, confirmCallbackStr, isDanger = true) {
            const overlay = document.getElementById('confirmOverlay');
            const content = document.getElementById('confirmContent');
            const btnClass = isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700';
            const iconClass = isDanger ? 'text-red-500 fa-triangle-exclamation' : 'text-emerald-500 fa-circle-question';

            content.innerHTML = `
                <div class="mb-4">
                    <i class="fa-solid ${iconClass} text-5xl mb-2"></i><h3 class="text-lg font-bold text-slate-900">${title}</h3><p class="text-sm text-slate-500 mt-2">${message}</p>
                </div>
                <div class="flex gap-3 justify-center mt-6">
                    <button onclick="closeConfirm()" class="px-5 py-2.5 bg-slate-200 text-slate-700 text-xs font-bold rounded-xl hover:bg-slate-300 w-1/2">Batal</button>
                    <button onclick="${confirmCallbackStr}; closeConfirm();" class="px-5 py-2.5 ${btnClass} text-white text-xs font-bold rounded-xl w-1/2">Ya, Lanjutkan</button>
                </div>`;
            overlay.classList.remove('hidden');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);
        }

        function closeConfirm() {
            const overlay = document.getElementById('confirmOverlay');
            const content = document.getElementById('confirmContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 200);
        }

        function exportTableToExcel(tableID, filename = '') {
            let tableSelect = document.getElementById(tableID);
            let cloneTable = tableSelect.cloneNode(true);
            let ths = cloneTable.querySelectorAll('th.no-export');
            let tds = cloneTable.querySelectorAll('td.no-export');
            ths.forEach(el => el.remove()); tds.forEach(el => el.remove());
            let wb = XLSX.utils.table_to_book(cloneTable, {sheet:"Sheet1"});
            filename = filename ? filename + '.xlsx' : 'ExportData.xlsx';
            XLSX.writeFile(wb, filename);
        }

        function getMonthYearFilterHTML(onChangeFnName, includeDate = true) {
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            const monthOpts = months.map((m, i) => `<option value="${i+1}" ${currentFilterMonth === i+1 ? 'selected' : ''}>${m}</option>`).join('');
            
            const currentYear = new Date().getFullYear();
            let yearOpts = '';
            for(let y = currentYear - 2; y <= currentYear + 1; y++) {
                yearOpts += `<option value="${y}" ${currentFilterYear === y ? 'selected' : ''}>${y}</option>`;
            }

            let dateFilterHTML = '';
            if (includeDate) {
                dateFilterHTML = `
                    <div class="flex-1 min-w-[130px]">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tgl Spesifik</label>
                        <input type="date" id="filterDate" value="${currentFilterDate}" onchange="updateFilterState(); ${onChangeFnName}()" class="w-full px-3 py-2 border rounded-xl text-xs font-medium focus:ring-emerald-500 outline-none">
                    </div>
                `;
            }

            return `
                <div class="flex flex-wrap gap-2 items-end">
                    ${dateFilterHTML}
                    <div class="flex-1 min-w-[120px]">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Bulan</label>
                        <select id="filterMonth" onchange="updateFilterState(); ${onChangeFnName}()" class="w-full px-3 py-2 border rounded-xl text-xs font-medium focus:ring-emerald-500 outline-none">
                            <option value="all">-- Semua Bulan --</option>
                            ${monthOpts}
                        </select>
                    </div>
                    <div class="flex-1 min-w-[100px]">
                        <label class="block text-[11px] font-bold text-slate-500 uppercase mb-1">Tahun</label>
                        <select id="filterYear" onchange="updateFilterState(); ${onChangeFnName}()" class="w-full px-3 py-2 border rounded-xl text-xs font-medium focus:ring-emerald-500 outline-none">
                            ${yearOpts}
                        </select>
                    </div>
                    ${includeDate ? `
                    <div class="flex-none">
                        <button onclick="clearFilterDate(); ${onChangeFnName}()" class="px-3 py-2 border border-slate-300 rounded-xl bg-white hover:bg-slate-100 text-slate-500 text-xs font-bold" title="Hapus Filter Tanggal Spesifik"><i class="fa-solid fa-rotate-left"></i></button>
                    </div>
                    ` : ''}
                </div>
            `;
        }

        function updateFilterState() {
            const m = document.getElementById('filterMonth').value;
            const y = document.getElementById('filterYear').value;
            const dEl = document.getElementById('filterDate');
            currentFilterDate = dEl ? dEl.value : '';
            
            currentFilterMonth = m === 'all' ? 'all' : parseInt(m);
            currentFilterYear = parseInt(y);
        }

        function clearFilterDate() {
            const dEl = document.getElementById('filterDate');
            if(dEl) { dEl.value = ''; currentFilterDate = ''; }
        }

        function isDateInFilter(dateString) {
            if(!dateString) return false;
            if (currentFilterDate && currentFilterDate !== '') return dateString === currentFilterDate;
            const d = new Date(dateString);
            const m = d.getMonth() + 1;
            const y = d.getFullYear();
            if (currentFilterMonth === 'all') return y === currentFilterYear;
            return m === currentFilterMonth && y === currentFilterYear;
        }

        function handleLogin(e) {
            e.preventDefault();
            const uInput = document.getElementById('loginUsername').value.trim();
            const pInput = document.getElementById('loginPassword').value.trim();
            const foundUser = usersData.find(u => u.username.toLowerCase() === uInput.toLowerCase() && u.password === pInput);

            if (foundUser) {
                currentUser = foundUser;
                showToast(`Login Berhasil. Selamat datang, ${currentUser.name}!`, 'success');
                renderApp();
            } else {

        function renderApp() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');

            document.getElementById('navUserName').innerText = currentUser.name;
            document.getElementById('navUserBadge').innerText = currentUser.role === 'admin' ? 'ADMIN' : 'STAFF';

                'inline-block text-[10px] px-2 py-0.5 rounded-full font-bold bg-emerald-900/60 text-emerald-300 border border-emerald-500/30 mt-0.5';

            activeTab = currentUser.role === 'staff' ? 'biaya' : 'dashboard';
            renderSidebarNav();
            switchTab(activeTab);
            startLiveClock();

        function renderSidebarNav() {
            const nav = document.getElementById('sidebarNav');
            let items = currentUser.role === 'staff' ? [{ id: 'biaya', icon: 'fa-receipt', label: 'Biaya Operasional' }] : [
                { id: 'dashboard', icon: 'fa-chart-pie', label: 'Dashboard Utama' },
                { id: 'pembelian', icon: 'fa-cart-shopping', label: 'Beli Pemasok' },
                { id: 'penjualan', icon: 'fa-file-invoice-dollar', label: 'Jual Konsumen' },
                { id: 'biaya', icon: 'fa-receipt', label: 'Biaya Operasional' },
                { id: 'bayar_pembelian', icon: 'fa-hand-holding-dollar', label: 'Hutang Pemasok' },
                { id: 'bayar_penjualan', icon: 'fa-money-bill-transfer', label: 'Piutang Konsumen' },
                { id: 'master', icon: 'fa-database', label: 'Master Data' }
            ];

            nav.innerHTML = items.map(item => `
                <button onclick="switchTab('${item.id}'); if(window.innerWidth < 768) toggleMobileNav();" class="w-full flex items-center gap-3 px-3 py-3 rounded-xl text-xs font-bold transition ${activeTab === item.id ? 'bg-emerald-600 text-white shadow-md' : 'text-slate-400 hover:text-white hover:bg-slate-800'}">
                    <i class="fa-solid ${item.icon} w-5 text-center text-sm"></i><span>${item.label}</span>
                </button>
            `).join('');
        }

        function switchTab(tabId) {
            if (currentUser.role === 'staff' && tabId !== 'biaya') tabId = 'biaya';
            activeTab = tabId;
            renderSidebarNav();
            const container = document.getElementById('mainContainer');
            const pt = document.getElementById('pageTitle');

            switch (tabId) {
                case 'dashboard': pt.innerText = "Dashboard Keuangan"; renderDashboard(container); break;
                case 'pembelian': pt.innerText = "Data Pembelian"; renderPembelianView(container); break;
                case 'penjualan': pt.innerText = "Data Penjualan"; renderPenjualanView(container); break;
                case 'biaya': pt.innerText = "Biaya Operasional"; renderBiayaView(container); break;
                case 'bayar_pembelian': pt.innerText = "Pelunasan Hutang Pemasok"; renderBayarPembelianView(container); break;
                case 'bayar_penjualan': pt.innerText = "Penerimaan Piutang Konsumen"; renderBayarPenjualanView(container); break;
                case 'master': pt.innerText = "Database Master"; renderMasterView(container); break;

        // ================= DASHBOARD =================
        function renderDashboardHelper() { renderDashboard(document.getElementById('mainContainer')); }
        
        function renderDashboard(container) {
            const filteredPurchases = purchasesData.filter(p => isDateInFilter(p.tanggal));
            const filteredSales = salesData.filter(s => isDateInFilter(s.tanggal));
            const filteredExpenses = expensesData.filter(e => isDateInFilter(e.tanggal));

            const totalPembelian = filteredPurchases.reduce((acc, p) => acc + (p.totalBeli || 0), 0);
            const totalPembelianKg = filteredPurchases.reduce((acc, p) => acc + (p.totalTonase || 0), 0);
            const totalPenjualan = filteredSales.reduce((acc, s) => acc + (s.totalJual || 0), 0);
            const totalPenjualanKg = filteredSales.reduce((acc, s) => acc + (s.totalTonase || 0), 0);
            const totalBiaya = filteredExpenses.reduce((acc, e) => acc + (e.total || 0), 0);

            const labaKotor = totalPenjualan - totalPembelian;
            const labaBersih = labaKotor - totalBiaya;

            // Global Hutang Piutang
            const allTotalPembelian = purchasesData.reduce((acc, p) => acc + (p.totalBeli || 0), 0);
            const paidPurchases = purchasePayments.reduce((acc, pay) => acc + (pay.jumlah || 0), 0);
            const sisaHutang = Math.max(0, allTotalPembelian - paidPurchases);
            
            const allTotalPenjualan = salesData.reduce((acc, s) => acc + (s.totalJual || 0), 0);
            const paidSales = salesPayments.reduce((acc, pay) => acc + (pay.jumlah || 0), 0);
            const sisaPiutang = Math.max(0, allTotalPenjualan - paidSales);

            container.innerHTML = `
                <div class="flex flex-col md:flex-row justify-end mb-4 bg-white p-3 rounded-2xl shadow-sm border border-slate-200">
                    ${getMonthYearFilterHTML('renderDashboardHelper', true)}
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <p class="text-[11px] font-bold text-slate-500 uppercase">Jual (Periode Ini)</p>
                        <h3 class="text-xl font-extrabold text-slate-900 mt-1">${formatRp(totalPenjualan)}</h3>
                        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-weight-hanging text-emerald-600 mr-1"></i>${formatKg(totalPenjualanKg)}</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <p class="text-[11px] font-bold text-slate-500 uppercase">Beli (Periode Ini)</p>
                        <h3 class="text-xl font-extrabold text-slate-900 mt-1">${formatRp(totalPembelian)}</h3>
                        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-truck-ramps text-amber-600 mr-1"></i>${formatKg(totalPembelianKg)}</p>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <p class="text-[11px] font-bold text-slate-500 uppercase">Biaya (Periode Ini)</p>
                        <h3 class="text-xl font-extrabold text-red-600 mt-1">${formatRp(totalBiaya)}</h3>
                        <p class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-receipt text-red-500 mr-1"></i>${filteredExpenses.length} Trx</p>
                    </div>
                    <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 shadow-sm text-white">
                        <p class="text-[11px] font-bold text-emerald-400 uppercase">Laba Bersih (Periode Ini)</p>
                        <h3 class="text-xl font-extrabold text-white mt-1">${formatRp(labaBersih)}</h3>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                        <div><p class="text-xs font-bold text-slate-500 uppercase">Total Piutang Konsumen (Global)</p><h4 class="text-lg font-extrabold text-slate-900 mt-1">${formatRp(sisaPiutang)}</h4></div>
                        <i class="fa-solid fa-money-bill-trend-up text-3xl text-blue-200"></i>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 flex justify-between items-center shadow-sm">
                        <div><p class="text-xs font-bold text-slate-500 uppercase">Total Hutang Pemasok (Global)</p><h4 class="text-lg font-extrabold text-slate-900 mt-1">${formatRp(sisaHutang)}</h4></div>
                        <i class="fa-solid fa-hand-holding-dollar text-3xl text-orange-200"></i>
                    </div>
                </div>

                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <h4 class="text-sm font-bold text-slate-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-chart-line text-emerald-600"></i> Grafik Periode Terpilih</h4>
                    <div class="h-64 relative w-full"><canvas id="dashboardChart"></canvas></div>
                </div>
            `;

            setTimeout(() => {
                const ctx = document.getElementById('dashboardChart');
                if (ctx) {
                    new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Penjualan', 'Pembelian', 'Laba Kotor', 'Biaya Ops', 'Laba Bersih'],
                            datasets: [{
                                label: 'Nominal (Rp)', data: [totalPenjualan, totalPembelian, labaKotor, totalBiaya, labaBersih],
                                backgroundColor: ['#10b981', '#f59e0b', '#3b82f6', '#ef4444', '#059669'], borderRadius: 6
                            }]
                        },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                                   scales: { y: { ticks: { callback: v => 'Rp ' + (v / 1000000).toFixed(0) + 'Jt' } } } }
                    });
                }
            }, 100);
        }

                    <div class="flex gap-4 border-b border-slate-200 pb-2 overflow-x-auto custom-scrollbar">

                        <button onclick="changeMasterTab('konsumen')" id="tab_konsumen" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">Konsumen</button>
                        <button onclick="changeMasterTab('sopir')" id="tab_sopir" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">Sopir</button>
                        <button onclick="changeMasterTab('nopol')" id="tab_nopol" class="px-4 py-2 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 whitespace-nowrap">Armada/Nopol</button>

                </div>
            `;
            changeMasterTab('users');
        }

        let currentMasterType = 'users';
        function changeMasterTab(type) {
            currentMasterType = type;
            ['users', 'pemasok', 'konsumen', 'sopir', 'nopol'].forEach(t => {
                const el = document.getElementById(`tab_${t}`);
                if(el) {
                    if(t === type) { el.classList.replace('border-transparent', 'border-emerald-600'); el.classList.replace('text-slate-500', 'text-emerald-700'); } 
                    else { el.classList.replace('border-emerald-600', 'border-transparent'); el.classList.replace('text-emerald-700', 'text-slate-500'); }
                }

            renderMasterContent();

        function renderMasterContent() {
            const container = document.getElementById('masterContentContainer');
            let data = currentMasterType === 'users' ? usersData : masterData[currentMasterType];
            let thead = '', rows = '';

            if (currentMasterType === 'users') {
                thead = `<tr><th>Nama</th><th>Username</th><th>Password</th><th>Role</th><th class="text-right">Aksi</th></tr>`;
                rows = data.map((d, i) => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="py-3 px-2 font-bold">${d.name}</td><td class="py-3 px-2">${d.username}</td><td class="py-3 px-2">${d.password}</td><td class="py-3 px-2"><span class="px-2 py-1 bg-slate-200 rounded text-[10px] uppercase font-bold">${d.role}</span></td><td class="py-3 px-2 text-right"><button onclick="openMasterModal('users', ${i})" class="text-blue-600 mr-3"><i class="fa-solid fa-pen"></i></button>${d.username !== 'admin' ? `<button onclick="deleteMasterData('users', ${i})" class="text-red-600"><i class="fa-solid fa-trash"></i></button>` : ''}</td></tr>`).join('');
            } else if (currentMasterType === 'nopol') {
                thead = `<tr><th>Nopol</th><th>Jenis</th><th>Sopir</th><th class="text-right">Aksi</th></tr>`;
                rows = data.map((d, i) => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="py-3 px-2 font-bold">${d.nopol}</td><td class="py-3 px-2">${d.jenis}</td><td class="py-3 px-2">${d.sopirDefault}</td><td class="py-3 px-2 text-right"><button onclick="openMasterModal('nopol', ${i})" class="text-blue-600 mr-3"><i class="fa-solid fa-pen"></i></button><button onclick="deleteMasterData('nopol', ${i})" class="text-red-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');
            } else {
                thead = `<tr><th>Nama/ID</th><th>Telepon</th>${currentMasterType !== 'sopir' ? '<th>Alamat</th>' : ''}<th class="text-right">Aksi</th></tr>`;
                rows = data.map((d, i) => `<tr class="border-b border-slate-100 hover:bg-slate-50"><td class="py-3 px-2 font-bold">${d.nama} <br><span class="text-[10px] text-slate-400 font-normal">${d.id}</span></td><td class="py-3 px-2">${d.telepon}</td>${currentMasterType !== 'sopir' ? `<td class="py-3 px-2 text-xs">${d.alamat || '-'}</td>` : ''}<td class="py-3 px-2 text-right"><button onclick="openMasterModal('${currentMasterType}', ${i})" class="text-blue-600 mr-3"><i class="fa-solid fa-pen"></i></button><button onclick="deleteMasterData('${currentMasterType}', ${i})" class="text-red-600"><i class="fa-solid fa-trash"></i></button></td></tr>`).join('');

            container.innerHTML = `

                    <h3 class="font-bold text-slate-800 uppercase text-sm">Data ${currentMasterType}</h3>

                </div>
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-left text-xs whitespace-nowrap"><thead class="bg-slate-100 text-slate-600 font-bold border-b">${thead}</thead><tbody>${rows || '<tr><td colspan="5" class="text-center py-4 text-slate-400">Tidak ada data</td></tr>'}</tbody></table>
                </div>

        }

        function openMasterModal(type, editIndex = -1) {
            let item = editIndex >= 0 ? (type === 'users' ? usersData[editIndex] : masterData[type][editIndex]) : {};
            let title = editIndex >= 0 ? 'Edit Data' : 'Tambah Data';
            let formFields = '';
            
            if (type === 'users') {
                formFields = `
                    <div class="space-y-3">
                        <div><label class="text-xs font-bold">Nama Pegawai</label><input type="text" id="m_name" value="${item.name||''}" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="text-xs font-bold">Username</label><input type="text" id="m_user" value="${item.username||''}" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="text-xs font-bold">Password</label><input type="text" id="m_pass" value="${item.password||''}" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="text-xs font-bold">Role Akses</label><select id="m_role" class="w-full border p-2 rounded-lg text-sm"><option value="staff" ${item.role==='staff'?'selected':''}>STAFF (Hanya Input Biaya)</option><option value="admin" ${item.role==='admin'?'selected':''}>ADMIN (Akses Penuh)</option></select></div>
                    </div>`;
            } else if (type === 'nopol') {
                const sopirOpts = masterData.sopir.map(s => `<option value="${s.nama}" ${item.sopirDefault===s.nama?'selected':''}>${s.nama}</option>`).join('');
                formFields = `
                    <div class="space-y-3">
                        <div><label class="text-xs font-bold">Nopol Kendaraan</label><input type="text" id="m_nopol" value="${item.nopol||''}" required class="w-full border p-2 rounded-lg text-sm uppercase"></div>
                        <div><label class="text-xs font-bold">Jenis Kendaraan</label><input type="text" id="m_jenis" value="${item.jenis||''}" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="text-xs font-bold">Sopir Default</label><select id="m_sopir" class="w-full border p-2 rounded-lg text-sm"><option value="">--Pilih Sopir--</option>${sopirOpts}</select></div>
                    </div>`;
            } else {
                formFields = `
                    <div class="space-y-3">
                        ${editIndex === -1 ? `<div><label class="text-xs font-bold">ID Kode</label><input type="text" id="m_id" required class="w-full border p-2 rounded-lg text-sm uppercase"></div>` : `<input type="hidden" id="m_id" value="${item.id}">`}
                        <div><label class="text-xs font-bold">Nama Lengkap</label><input type="text" id="m_nama" value="${item.nama||''}" required class="w-full border p-2 rounded-lg text-sm"></div>
                        <div><label class="text-xs font-bold">Telepon/WA</label><input type="text" id="m_telp" value="${item.telepon||''}" required class="w-full border p-2 rounded-lg text-sm"></div>
                        ${type !== 'sopir' ? `<div><label class="text-xs font-bold">Alamat</label><textarea id="m_alamat" class="w-full border p-2 rounded-lg text-sm">${item.alamat||''}</textarea></div>` : ''}
                    </div>`;
            }

            showModal(`<div><h3 class="text-lg font-bold text-slate-900 mb-4">${title} ${type.toUpperCase()}</h3><form onsubmit="saveMasterData(event, '${type}', ${editIndex})">${formFields}<div class="mt-5 flex justify-end gap-2"><button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-200 rounded-lg text-xs font-bold text-slate-700">Batal</button><button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded-lg text-xs font-bold">Simpan</button></div></form></div>`);
        }

        function saveMasterData(e, type, index) {
            e.preventDefault();
            let newData = {};
            if (type === 'users') {
                newData = { id: index >= 0 ? usersData[index].id : Date.now(), name: document.getElementById('m_name').value, username: document.getElementById('m_user').value, password: document.getElementById('m_pass').value, role: document.getElementById('m_role').value };
                if(index >= 0) usersData[index] = newData; else usersData.push(newData);
            } else if (type === 'nopol') {
                newData = { id: index >= 0 ? masterData.nopol[index].id : 'NPL-'+Date.now(), nopol: document.getElementById('m_nopol').value.toUpperCase(), jenis: document.getElementById('m_jenis').value, sopirDefault: document.getElementById('m_sopir').value };
                if(index >= 0) masterData.nopol[index] = newData; else masterData.nopol.push(newData);
            } else {
                newData = { id: index >= 0 ? document.getElementById('m_id').value : document.getElementById('m_id').value.toUpperCase(), nama: document.getElementById('m_nama').value, telepon: document.getElementById('m_telp').value, alamat: type !== 'sopir' ? document.getElementById('m_alamat').value : undefined };
                if(index >= 0) masterData[type][index] = newData; else masterData[type].push(newData);
            }
            saveData(); closeModal(); renderMasterContent(); showToast('Data master berhasil disimpan');
        }

        function deleteMasterData(type, index) { confirmAction('Hapus Data', 'Yakin ingin hapus?', `executeDeleteMaster('${type}', ${index})`); }
        function executeDeleteMaster(type, index) {
            if(type === 'users' && usersData[index].username === 'admin') return showToast('Admin utama tidak bisa dihapus', 'danger');
            if(type === 'users') usersData.splice(index, 1); else masterData[type].splice(index, 1);
            saveData(); renderMasterContent(); showToast('Data dihapus');
        }

            container.innerHTML = `

        function addTrxItemRow() { tempTransactionItems.push({ nopol: '', sopir: '', tonase: 0, harga: 0, operasional: 0, subtotal: 0 }); renderTrxItems(); }
        function removeTrxItemRow(i) { tempTransactionItems.splice(i, 1); if(tempTransactionItems.length === 0) addTrxItemRow(); renderTrxItems(); }

        function renderTrxItems() {
            const container = document.getElementById('trxItemsContainer');
            if(!container) return;
            container.innerHTML = tempTransactionItems.map((item, i) => `
                <tr class="border-b"><td class="p-1"><select onchange="onNopolChange(${i}, this.value)" class="w-full border p-1 rounded text-xs"><option value="">Pilih...</option>${masterData.nopol.map(n => `<option value="${n.nopol}" ${item.nopol===n.nopol?'selected':''}>${n.nopol}</option>`).join('')}</select></td><td class="p-1"><select id="sopir_row_${i}" onchange="updateTrxItem(${i}, 'sopir', this.value)" class="w-full border p-1 rounded text-xs"><option value="">Pilih...</option>${masterData.sopir.map(s => `<option value="${s.nama}" ${item.sopir===s.nama?'selected':''}>${s.nama}</option>`).join('')}</select></td><td class="p-1"><input type="number" oninput="updateTrxItem(${i}, 'tonase', this.value)" value="${item.tonase||''}" class="w-full border p-1 rounded text-xs text-right"></td><td class="p-1"><input type="number" oninput="updateTrxItem(${i}, 'harga', this.value)" value="${item.harga||''}" class="w-full border p-1 rounded text-xs text-right"></td><td class="p-1 text-right font-bold"><div class="text-slate-700">${formatRp(item.subtotal)}</div><div class="flex justify-end gap-1 mt-1 text-[9px] text-slate-500">Ops: <input type="number" oninput="updateTrxItem(${i}, 'operasional', this.value)" value="${item.operasional||''}" class="w-16 border rounded p-1 text-right"></div></td><td class="p-1 text-center"><button type="button" onclick="removeTrxItemRow(${i})" class="text-red-500 p-1"><i class="fa-solid fa-circle-minus"></i></button></td></tr>
            `).join('');
            calculateTrxTotals();
        }

        function onNopolChange(i, val) {
            updateTrxItem(i, 'nopol', val);
            const nd = masterData.nopol.find(n => n.nopol === val);
            if(nd && nd.sopirDefault) { document.getElementById(`sopir_row_${i}`).value = nd.sopirDefault; updateTrxItem(i, 'sopir', nd.sopirDefault); }
        }

        function updateTrxItem(i, f, v) {
            if(['tonase','harga','operasional'].includes(f)) { tempTransactionItems[i][f] = parseFloat(v)||0; tempTransactionItems[i].subtotal = tempTransactionItems[i].tonase * tempTransactionItems[i].harga; }
            else { tempTransactionItems[i][f] = v; }
            calculateTrxTotals(); if(f==='tonase'||f==='harga') renderTrxItems();
        }

        function calculateTrxTotals() {
            let tKg=0, tRp=0, tOps=0;
            tempTransactionItems.forEach(i => { tKg+=(i.tonase||0); tRp+=(i.subtotal||0); tOps+=(i.operasional||0); });
            if(document.getElementById('beli_tot_kg')) document.getElementById('beli_tot_kg').innerText = formatKg(tKg);
            if(document.getElementById('beli_tot_rp')) document.getElementById('beli_tot_rp').innerHTML = `${formatRp(tRp)}<br><span class="text-[10px] text-slate-500">Ops: ${formatRp(tOps)}</span>`;
        }

        function savePembelian() {
            const tgl = document.getElementById('beli_tanggal').value; const pemasok = document.getElementById('beli_pemasok').value;
            if(!tgl || !pemasok) return showToast('Lengkapi data!', 'danger');
            const valid = tempTransactionItems.filter(i => i.nopol && i.tonase > 0 && i.harga > 0);
            if(valid.length === 0) return showToast('Minimal 1 armada valid!', 'danger');
            let tBeli=0, tOps=0, tKg=0; valid.forEach(i => { tBeli+=i.subtotal; tOps+=i.operasional; tKg+=i.tonase; });
            const id = document.getElementById('beli_id').value; const idx = purchasesData.findIndex(p => p.id === id);
            const dataToSave = { id, tanggal: tgl, pemasok, items: valid, totalBeli: tBeli, totalOperasional: tOps, totalTonase: tKg };
            if(idx >= 0) purchasesData[idx] = dataToSave; else purchasesData.unshift(dataToSave);
            saveData(); closeModal(); renderPembelianViewHelper(); showToast('Tersimpan!');
        }

        function handleFotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const img = new Image();
                img.src = e.target.result;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 600;
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    currentFotoBiayaBase64 = canvas.toDataURL('image/jpeg', 0.6); 
                    
                    const preview = document.getElementById('previewBiayaFoto');
                    if(preview) {
                        preview.src = currentFotoBiayaBase64;
                        preview.classList.remove('hidden');
                    }
                };
            };
        }

                total: parseFloat(document.getElementById('biaya_total').value),

                foto: currentFotoBiayaBase64

            if(!data.tanggal || !data.uraian || isNaN(data.total)) return showToast('Lengkapi data!', 'danger');

        // ================= FITUR BARU: HUTANG & PIUTANG =================
        function getPembayaranData(type) {
            const trxData = type === 'beli' ? purchasesData : salesData;
            const payData = type === 'beli' ? purchasePayments : salesPayments;
            return trxData.map(trx => {
                const total = type === 'beli' ? trx.totalBeli : trx.totalJual;
                const payments = payData.filter(p => p.trxId === trx.id);
                const paid = payments.reduce((acc, curr) => acc + curr.jumlah, 0);
                const sisa = total - paid;
                const status = sisa <= 0 ? 'Lunas' : (paid > 0 ? 'Sebagian' : 'Belum Lunas');
                return { ...trx, total, paid, sisa, status, payments };
            });
        }

        function savePembayaran(e, type, trxId, maxSisa) {
            e.preventDefault();
            const tanggal = document.getElementById('bayar_tanggal').value;
            const jumlah = parseFloat(document.getElementById('bayar_jumlah').value);
            const ket = document.getElementById('bayar_ket').value;
            
            if (jumlah <= 0 || jumlah > maxSisa) return showToast('Nominal tidak valid!', 'danger');
            
            const payData = { id: generateId('PAY'), trxId: trxId, tanggal: tanggal, jumlah: jumlah, keterangan: ket, inputBy: currentUser.username };
            
            if (type === 'beli') purchasePayments.push(payData); else salesPayments.push(payData);
            
            saveData(); closeModal(); showToast('Pembayaran dicatat!', 'success');
            if (type === 'beli') renderBayarPembelianViewHelper(); else renderBayarPenjualanViewHelper();
        }

                                <td style="border: 1px solid #cbd5e1; padding: 12px; text-align: right; font-weight: bold; color: #059669;">${formatKg(data.totalTonase)}</td>
                                <td></td>
                                <td style="border: 1px solid #cbd5e1; padding: 12px; text-align: right; font-weight: bold; font-size: 16px; color: #0f172a;">${formatRp(totalVal)}</td>
                            </tr>
                        </tfoot>
                    </table>
                    
                    <div style="margin-top: 50px; display: flex; justify-content: flex-end; text-align: center; font-size: 14px;">
                        <div>
                            <p style="margin-bottom: 70px;">Hormat Kami,</p>
                            <p style="text-decoration: underline; font-weight: bold;">Manajemen Atmajaya</p>
                        </div>
                    </div>
                </div>
            `;

            showToast('Menyiapkan file PDF...', 'info');
            
            const opt = {
                margin:       [10, 10, 10, 10], // top, left, bottom, right
                filename:     `Invoice_${data.id}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, logging: false },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            // Wait slightly for DOM to fully update before rendering canvas
            setTimeout(() => {
                html2pdf().set(opt).from(container).save().then(() => {
                    showToast('PDF Berhasil Diunduh', 'success');
                }).catch(err => {
                    console.error("PDF Error:", err);
                    showToast('Gagal membuat PDF', 'danger');
                });
            }, 600);
        }

        function sendWA(type, id) {
            let data, title;
            if (type === 'beli' || type === 'hutang') {
                data = purchasesData.find(p => p.id === id);
                title = 'INVOICE PEMBELIAN';
            } else {
                data = salesData.find(s => s.id === id);
                title = 'INVOICE PENJUALAN';
            }

            if (!data) return showToast('Data tidak ditemukan', 'danger');

            let totalVal = type === 'beli' || type === 'hutang' ? data.totalBeli : data.totalJual;
            let targetName = type === 'beli' || type === 'hutang' ? data.pemasok : data.konsumen;

            let text = `*ATMAJAYA BHARATA UNGGAS*\n`;
            text += `*${title}*\n\n`;
            text += `No. Transaksi: ${data.id}\n`;
            text += `Tanggal: ${formatTanggal(data.tanggal)}\n`;
            text += `${type === 'beli' || type === 'hutang' ? 'Pemasok' : 'Kepada Yth'}: *${targetName}*\n`;
            text += `--------------------------------\n`;
            text += `Total Pengiriman: *${formatKg(data.totalTonase)}*\n`;
            text += `Total Tagihan: *${formatRp(totalVal)}*\n`;
            text += `--------------------------------\n\n`;
            text += `Mohon segera diproses. Terima kasih atas kerjasamanya.`;

            const encodedText = encodeURIComponent(text);
            window.open(`https://wa.me/?text=${encodedText}`, '_blank');
        }

        // Initialize App UI based on Session Status (always starts at login for this stateless demo)
        document.addEventListener('DOMContentLoaded', () => {
            // Ensure we start on the login screen
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('appScreen').classList.add('hidden');
        });

    </script>
</body>
</html>
